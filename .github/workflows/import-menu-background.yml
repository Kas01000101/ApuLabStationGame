name: Import canonical menu background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-menu-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-background:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download canonical Fondo_menu.png
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/menu
          curl --fail --location --retry 3 \
            'https://drive.usercontent.google.com/download?id=19RMYgjglV0jHxjEzdFv2MSwcO2YAVeSL&export=download&confirm=t' \
            --output public/assets/menu/Fondo_menu.png

          python - <<'PY'
          from pathlib import Path
          import struct

          p = Path('public/assets/menu/Fondo_menu.png')
          data = p.read_bytes()
          assert len(data) == 1846613, f'unexpected size: {len(data)}'
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'not a PNG'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (1633, 963), (width, height)
          print(f'Validated Fondo_menu.png: {width}x{height}, {len(data)} bytes')
          PY

      - name: Commit image into GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/menu/Fondo_menu.png
          if git diff --cached --quiet; then
            echo 'Fondo_menu.png is already committed.'
            exit 0
          fi
          git commit -m 'asset: add canonical Fondo_menu.png'
          git push origin HEAD:main
