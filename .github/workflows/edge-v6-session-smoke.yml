name: Edge v6 authenticated session smoke

on:
  push:
    branches:
      - research/edge-v6-live-smoke
    paths:
      - .github/workflows/edge-v6-session-smoke.yml

permissions:
  contents: read

env:
  EDGE_BASE: https://dkvxbvacsegneszuopwy.supabase.co/functions/v1/ingest-telemetry
  ORIGIN: https://apulab-station-study.netlify.app
  SMOKE_PID: 019f4ced-2045-4886-858d-2a9984d9d6df

jobs:
  edge-v6-session-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Generate and self-verify QT-010 credential material
        id: material
        shell: bash
        run: |
          set -euo pipefail
          CREDENTIAL=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )
          echo "::add-mask::$CREDENTIAL"
          echo "SMOKE_CREDENTIAL=$CREDENTIAL" >> "$GITHUB_ENV"

          CRED_HASH_B64=$(CREDENTIAL="$CREDENTIAL" python - <<'PY'
          import os, hashlib, base64, hmac
          credential=os.environ['CREDENTIAL'].encode('utf-8')
          salt=os.urandom(16)
          iterations=210000
          digest=hashlib.pbkdf2_hmac('sha256', credential, salt, iterations, dklen=32)
          b64=lambda b: base64.urlsafe_b64encode(b).decode().rstrip('=')
          stored=f'pbkdf2_sha256${iterations}${b64(salt)}${b64(digest)}'

          # Regression contract matching Edge verifyCredential(): parse iterations
          # from the stored hash, base64url-decode salt/digest, derive PBKDF2-SHA256.
          parts=stored.split('$')
          assert len(parts)==4 and parts[0]=='pbkdf2_sha256'
          parsed_iterations=int(parts[1])
          def unb64(s): return base64.urlsafe_b64decode(s + '='*((4-len(s)%4)%4))
          parsed_salt=unb64(parts[2]); expected=unb64(parts[3])
          actual=hashlib.pbkdf2_hmac('sha256', credential, parsed_salt, parsed_iterations, dklen=len(expected))
          wrong=hashlib.pbkdf2_hmac('sha256', b'wrong-credential', parsed_salt, parsed_iterations, dklen=len(expected))
          assert hmac.compare_digest(actual, expected)
          assert not hmac.compare_digest(wrong, expected)
          print(b64(stored.encode('utf-8')))
          PY
          )
          echo "cred_hash_b64=$CRED_HASH_B64" >> "$GITHUB_OUTPUT"
          echo 'CREDENTIAL_HASH_REGRESSION=PASS'
          echo smoke > /tmp/provision-marker.txt

      - name: Publish non-secret provisioning marker
        uses: actions/upload-artifact@v4
        with:
          name: edge-v6-provision-${{ env.SMOKE_PID }}-${{ steps.material.outputs.cred_hash_b64 }}
          path: /tmp/provision-marker.txt
          retention-days: 1

      - name: Provisioning grace period
        run: sleep 120

      - name: Authenticate provisioned QT-010
        shell: bash
        run: |
          set -euo pipefail
          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$EDGE_BASE/authenticate" \
            -H 'Content-Type: application/json' -H "Origin: $ORIGIN" \
            --data "$(jq -nc --arg c 'QT-010' --arg p "$SMOKE_CREDENTIAL" '{study_code:$c,credential:$p}')")
          if [ "$code" != "200" ]; then
            err=$(jq -r '.error // "unknown"' "$out")
            echo "EDGE_AUTH_HTTP=$code EDGE_AUTH_ERROR=$err"
            exit 1
          fi
          jq -e --arg pid "$SMOKE_PID" '.success == true and .data.participant_id == $pid and .data.study_id == "APULAB-QA-2026" and .data.study_condition == "game"' "$out" >/dev/null
          PROOF=$(jq -r '.data.session_proof' "$out")
          test -n "$PROOF" && test "$PROOF" != "null"
          echo "::add-mask::$PROOF"
          echo "SMOKE_PROOF=$PROOF" >> "$GITHUB_ENV"
          echo 'EDGE_AUTH_SMOKE=PASS'

      - name: Run live session create guard resume and idempotency contracts
        id: contracts
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SHA='6fba1e010fde9abf5985660e7a346ccd730d27e9'
          BUILD_VERSION='APULAB-STUDY-1.0.0'
          SCHEMA_VERSION='apulab-telemetry-v2'
          PROTOCOL_VERSION='apulab-protocol-2026-v1'

          SESSION_A=$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )
          TOKEN_A=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )
          echo "::add-mask::$TOKEN_A"
          STARTED_A=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PAYLOAD_A=$(jq -nc --arg proof "$SMOKE_PROOF" --arg tok "$TOKEN_A" --arg sid "$SESSION_A" \
            --arg started "$STARTED_A" --arg sha "$BUILD_SHA" --arg build "$BUILD_VERSION" \
            --arg schema "$SCHEMA_VERSION" --arg protocol "$PROTOCOL_VERSION" \
            '{session_proof:$proof,session_sync_token:$tok,session:{session_id:$sid,session_mode:"study",environment:"preview",build_version:$build,git_commit_sha:$sha,schema_version:$schema,protocol_version:$protocol,started_at:$started,screen_width:1280,screen_height:720}}')

          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$EDGE_BASE/session" -H 'Content-Type: application/json' -H "Origin: $ORIGIN" --data "$PAYLOAD_A")
          test "$code" = "200"
          jq -e '.success == true' "$out" >/dev/null
          echo 'EDGE_SESSION_CREATE=PASS'

          SESSION_B=$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )
          TOKEN_B=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )
          echo "::add-mask::$TOKEN_B"
          STARTED_B=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PAYLOAD_B=$(jq -nc --arg proof "$SMOKE_PROOF" --arg tok "$TOKEN_B" --arg sid "$SESSION_B" \
            --arg started "$STARTED_B" --arg sha "$BUILD_SHA" --arg build "$BUILD_VERSION" \
            --arg schema "$SCHEMA_VERSION" --arg protocol "$PROTOCOL_VERSION" \
            '{session_proof:$proof,session_sync_token:$tok,session:{session_id:$sid,session_mode:"study",environment:"preview",build_version:$build,git_commit_sha:$sha,schema_version:$schema,protocol_version:$protocol,started_at:$started,screen_width:1280,screen_height:720}}')

          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$EDGE_BASE/session" -H 'Content-Type: application/json' -H "Origin: $ORIGIN" --data "$PAYLOAD_B")
          test "$code" = "409"
          jq -e '.success == false and .error == "active_session_exists"' "$out" >/dev/null
          echo 'EDGE_CONCURRENT_SESSION_GUARD=PASS'

          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$EDGE_BASE/session/resume" -H 'Content-Type: application/json' -H "Origin: $ORIGIN" \
            --data "$(jq -nc --arg sid "$SESSION_A" --arg tok "$TOKEN_A" '{session_id:$sid,session_sync_token:$tok}')")
          test "$code" = "200"
          jq -e --arg sid "$SESSION_A" '.success == true and .data.session_id == $sid and .data.status == "in_progress" and (.data.event_seq_last|tonumber) == 0' "$out" >/dev/null
          echo 'EDGE_RESUME_VALID=PASS'

          WRONG_TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          )
          echo "::add-mask::$WRONG_TOKEN"
          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$EDGE_BASE/session/resume" -H 'Content-Type: application/json' -H "Origin: $ORIGIN" \
            --data "$(jq -nc --arg sid "$SESSION_A" --arg tok "$WRONG_TOKEN" '{session_id:$sid,session_sync_token:$tok}')")
          test "$code" = "403"
          jq -e '.success == false and .error == "session_sync_token_invalid"' "$out" >/dev/null
          echo 'EDGE_RESUME_INVALID_TOKEN=PASS'

          out=$(mktemp)
          code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$EDGE_BASE/session" -H 'Content-Type: application/json' -H "Origin: $ORIGIN" --data "$PAYLOAD_A")
          test "$code" = "200"
          jq -e '.success == true' "$out" >/dev/null
          echo 'EDGE_SESSION_IDEMPOTENCY=PASS'

          echo "session_a=$SESSION_A" >> "$GITHUB_OUTPUT"
          echo "session_b=$SESSION_B" >> "$GITHUB_OUTPUT"
          echo smoke-pass > /tmp/pass-marker.txt
          {
            echo '### Edge v6 authenticated session smoke'
            echo '- CREDENTIAL_HASH_REGRESSION = PASS'
            echo '- EDGE_AUTH_SMOKE = PASS'
            echo '- EDGE_SESSION_CREATE = PASS'
            echo '- EDGE_CONCURRENT_SESSION_GUARD = PASS'
            echo '- EDGE_RESUME_VALID = PASS'
            echo '- EDGE_RESUME_INVALID_TOKEN = PASS'
            echo '- EDGE_SESSION_IDEMPOTENCY = PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish non-secret smoke result
        uses: actions/upload-artifact@v4
        with:
          name: edge-v6-pass-${{ env.SMOKE_PID }}-${{ steps.contracts.outputs.session_a }}-${{ steps.contracts.outputs.session_b }}
          path: /tmp/pass-marker.txt
          retention-days: 1
