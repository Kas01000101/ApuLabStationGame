name: Edge v6 smoke secret preflight

on:
  push:
    branches:
      - research/edge-v6-live-smoke
    paths:
      - .github/workflows/edge-v6-secret-preflight.yml

permissions:
  contents: read

jobs:
  smoke-secret-preflight:
    runs-on: ubuntu-latest
    env:
      APULAB_SMOKE_DB_URL: ${{ secrets.APULAB_SMOKE_DB_URL }}
    steps:
      - name: DB secret is available
        if: ${{ env.APULAB_SMOKE_DB_URL != '' }}
        run: echo 'SMOKE_DB_SECRET=AVAILABLE'
      - name: DB secret is missing
        if: ${{ env.APULAB_SMOKE_DB_URL == '' }}
        run: |
          echo 'SMOKE_DB_SECRET=MISSING'
          exit 1
