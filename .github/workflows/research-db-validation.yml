name: Research DB validation

on:
  push:
    branches:
      - research/station-research-clean-v3
    paths:
      - 'supabase/**'
      - 'tests/research/**'
      - 'tests/e2e/research-offline-recovery.cjs'
      - '.github/workflows/research-db-validation.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/**'
      - 'tests/research/**'
      - 'tests/e2e/research-offline-recovery.cjs'
      - '.github/workflows/research-db-validation.yml'

permissions:
  contents: read

jobs:
  db-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Record CLI contract
        run: |
          supabase --version
          supabase --help >/tmp/supabase-help.txt
          supabase db --help >/tmp/supabase-db-help.txt
          supabase functions --help >/tmp/supabase-functions-help.txt
      - name: Start local Supabase
        run: supabase start
      - name: Rebuild fresh database from migrations
        run: supabase db reset
      - name: Resolve local database URL
        run: |
          supabase status -o env > /tmp/supabase.env
          DB_URL_VALUE=$(sed -n 's/^DB_URL="\{0,1\}\([^"[:space:]]*\)"\{0,1\}$/\1/p' /tmp/supabase.env)
          test -n "$DB_URL_VALUE"
          echo "DB_URL=$DB_URL_VALUE" >> "$GITHUB_ENV"
      - name: Fresh schema + security + canonical N6/N7 contract
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/research_fresh_contract.sql
      - name: Database idempotency and sequence integrity
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/research_idempotency.sql
      - name: Seed completion recovery fixture
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/research_completion_fixture.sql
      - name: Serve Edge Function locally
        run: |
          supabase functions serve ingest-telemetry --no-verify-jwt > /tmp/apulab-edge.log 2>&1 &
          echo $! > /tmp/apulab-edge.pid
          for i in {1..30}; do
            CODE=$(curl --silent --output /tmp/apulab-edge-probe.json --write-out '%{http_code}' \
              --request POST 'http://127.0.0.1:54321/functions/v1/ingest-telemetry/session/complete' \
              --header 'Content-Type: application/json' --data '{}' || true)
            if [ "$CODE" != "000" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/apulab-edge.log
          exit 1
      - name: Reject premature session completion
        run: |
          BODY='{"session_id":"00000000-0000-4000-8000-000000001002","session_sync_token":"0123456789abcdefghijklmnopqrstuvwxyzABCDEFGH"}'
          CODE=$(curl --silent --show-error --output /tmp/premature.json --write-out '%{http_code}' \
            --request POST 'http://127.0.0.1:54321/functions/v1/ingest-telemetry/session/complete' \
            --header 'Content-Type: application/json' --data "$BODY")
          cat /tmp/premature.json
          test "$CODE" = "409"
          grep -Fq 'session_not_complete' /tmp/premature.json
          test "$(psql "$DB_URL" -Atc "select status from apulab_sessions where session_id='00000000-0000-4000-8000-000000001002'")" = "in_progress"
      - name: Sync canonical completion events
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/research_completion_events.sql
      - name: Complete recovered session and verify idempotency
        run: |
          BODY='{"session_id":"00000000-0000-4000-8000-000000001002","session_sync_token":"0123456789abcdefghijklmnopqrstuvwxyzABCDEFGH"}'
          CODE=$(curl --silent --show-error --output /tmp/completed.json --write-out '%{http_code}' \
            --request POST 'http://127.0.0.1:54321/functions/v1/ingest-telemetry/session/complete' \
            --header 'Content-Type: application/json' --data "$BODY")
          cat /tmp/completed.json
          test "$CODE" = "200"
          grep -Fq '"success":true' /tmp/completed.json
          test "$(psql "$DB_URL" -Atc "select status from apulab_sessions where session_id='00000000-0000-4000-8000-000000001002'")" = "completed"
          test "$(psql "$DB_URL" -Atc "select last_level from apulab_sessions where session_id='00000000-0000-4000-8000-000000001002'")" = "7"
          CODE2=$(curl --silent --show-error --output /tmp/completed-again.json --write-out '%{http_code}' \
            --request POST 'http://127.0.0.1:54321/functions/v1/ingest-telemetry/session/complete' \
            --header 'Content-Type: application/json' --data "$BODY")
          cat /tmp/completed-again.json
          test "$CODE2" = "200"
          grep -Fq '"success":true' /tmp/completed-again.json
          test "$(psql "$DB_URL" -Atc "select count(*) from apulab_events where session_id='00000000-0000-4000-8000-000000001002' and event_type='session_completed'")" = "1"
      - name: Print Edge log on failure
        if: failure()
        run: cat /tmp/apulab-edge.log || true
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  db-legacy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGPASSWORD: postgres
      DB_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Supabase-compatible roles
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN CREATE ROLE anon NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE authenticated NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          DO $$ BEGIN CREATE ROLE service_role NOLOGIN; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
          SQL
      - name: Apply historical M1-M2 only
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260830090000_research_security_baseline.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260830091000_legacy_raw_code_nullable.sql
      - name: Seed synthetic legacy rows
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/research_legacy_fixture.sql
      - name: Apply clean forward migrations M3-M7
        run: |
          for migration in \
            supabase/migrations/20260906170000_research_schema_v2.sql \
            supabase/migrations/20260906183000_research_hardening.sql \
            supabase/migrations/20260907190000_research_pre_qa_hardening.sql \
            supabase/migrations/20260907230000_station_game_condition_guard.sql \
            supabase/migrations/20260908030000_edge_service_role_permissions.sql; do
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify legacy preservation and no study promotion
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/research_legacy_assertions.sql

  runtime-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - name: Type-check Research runtime
        run: npx tsc -b
      - name: Queue, retry, idempotency and canonical Research contracts
        run: node --test tests/research/*.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --global playwright@1.55.0 --no-fund --no-audit
          playwright install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Start Vite source server
        run: |
          npx vite --host 127.0.0.1 --port 4174 > /tmp/apulab-research-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/apulab-research-vite.log
          exit 1
      - name: Browser offline queue reload and recovery
        env:
          APULAB_BASE_URL: http://127.0.0.1:4174
        run: node tests/e2e/research-offline-recovery.cjs
      - name: Print Vite log on failure
        if: failure()
        run: cat /tmp/apulab-research-vite.log || true
