name: Build and verify Mission 01

on:
  push:
    branches:
      - main
      - mission01-levels-1-3
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify
        run: npm run build

      - name: Verify generated Mission 01 assets
        shell: bash
        run: |
          for level in 1 2 3 4 5 6 7; do
            test -f "public/missions/mission01/level${level}.html"
            grep -Fq "${level} / 7" "public/missions/mission01/level${level}.html"
          done

          test -f public/missions/mission01/manifest.json
          grep -Fq 'CONTINUAR AL NIVEL 4' public/missions/mission01/level3.html
          ! grep -Fq 'NIVEL 4 · PRÓXIMAMENTE' public/missions/mission01/level3.html
          grep -Fq 'CONTINUAR AL NIVEL 7' public/missions/mission01/level6.html
          grep -Fq 'MISIÓN 01 COMPLETADA' public/missions/mission01/level7.html
          grep -Fq 'MISIÓN CIENTÍFICA' public/missions/mission01/level6.html
          grep -Fq 'LA MUESTRA DESCONOCIDA' public/missions/mission01/level7.html
          grep -Fq 'ANALIZAR MUESTRA' public/missions/mission01/level7.html
          grep -Fq 'SENSOR DE TEMPERATURA' public/missions/mission01/level7.html
          grep -Fq 'SENSOR DE PROXIMIDAD' public/missions/mission01/level7.html
          grep -Fq 'ANALIZADOR DE MINERALES' public/missions/mission01/level7.html
          grep -Fq 'RANURA DE SENSOR' public/missions/mission01/level7.html
          grep -Fq 'REPETIR × N' public/missions/mission01/level6.html
          grep -Fq 'REPETIR × N' public/missions/mission01/level7.html
          ! grep -Fq 'data-command="read"' public/missions/mission01/level7.html
          ! grep -Fq 'data-command="record"' public/missions/mission01/level7.html
          ! grep -Fq 'data-command="send"' public/missions/mission01/level7.html
          grep -Fq '"totalLevels": 7' public/missions/mission01/manifest.json
          grep -Fq '"availableLevels"' public/missions/mission01/manifest.json
          grep -Fq '"level": 7' public/missions/mission01/manifest.json
          ! grep -R -Fq ' / 8' public/missions/mission01/level*.html
          ! grep -Fq 'CONTINUAR AL NIVEL 8' public/missions/mission01/level7.html

          node -e "const m=require('./public/missions/mission01/manifest.json'); const expected='1,2,3,4,5,6,7'; if(m.totalLevels!==7 || m.availableLevels.join(',')!==expected || (m.unavailableLevels||[]).length!==0 || m.levels.length!==7) process.exit(1)"
