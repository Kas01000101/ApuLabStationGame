name: Security and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Normalize package tree for audit
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit

      - name: Audit high severity vulnerabilities
        shell: bash
        run: |
          set -u
          for attempt in 1 2 3; do
            set +e
            output="$(npm audit --audit-level=high 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if printf '%s' "$output" | grep -Eqi '503 Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              if [ "$attempt" -lt 3 ]; then
                echo "npm audit endpoint unavailable; retrying attempt $((attempt + 1))/3"
                sleep $((attempt * 10))
                continue
              fi
            fi

            exit "$status"
          done
          exit 1

      - name: Upload verified dist
        uses: actions/upload-artifact@v4
        with:
          name: verified-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
