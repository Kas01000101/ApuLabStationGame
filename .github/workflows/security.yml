name: Security and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Build
        run: npm run build

      - name: Normalize package tree for audit
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit

      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Upload verified dist
        uses: actions/upload-artifact@v4
        with:
          name: verified-dist
          path: dist
          if-no-files-found: error
          retention-days: 1
